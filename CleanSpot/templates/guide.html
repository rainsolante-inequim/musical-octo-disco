{% extends "base.html" %}
{% block title %}Waste Guide{% endblock %}
{% block content %}
<div class="container py-5">
    <h1>Waste Guide</h1>
    <div class="table-responsive mt-4">
        <table class="table table-bordered table-hover">
            <thead class="table-success">
                <tr><th>Item</th><th>Category</th><th>Disposal Method</th></tr>
            </thead>
            <tbody>
            {% for item in wastes %}
                <tr><td>{{ item[0] }}</td><td>{{ item[1] }}</td><td>{{ item[2] }}</td></tr>
            {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
